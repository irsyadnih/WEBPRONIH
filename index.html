<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Mahasiswa Statistika Bisnis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main_content">
        <div class="form_box">
            <div class="form_title">FORM DATA MAHASISWA STATISTIKA BISNIS</div>
            
            <div class="form_content">
                <form>
                    <div class="form_group">
                        <label class="form_label">Nama</label>
                        <div class="input_container">
                            <input type="text" placeholder="Nama Lengkap" class="form_textbox">
                        </div>
                    </div>

                    <div class="form_group">
                        <label class="form_label">NRP</label>
                        <div class="input_container">
                            <input type="text" placeholder="Nomor Registrasi Pokok" class="form_textbox">
                        </div>
                    </div>

                    <div class="form_group">
                        <label class="form_label">TTL</label>
                        <div class="input_container">
                            <input type="text" placeholder="Tempat" class="form_textbox_short">
                            <input type="date" class="form_textbox_short">
                        </div>
                    </div>

                    <div class="form_group">
                        <label class="form_label">Asal Kota</label>
                        <div class="input_container">
                            <input type="text" placeholder="Kota Asal" class="form_textbox">
                        </div>
                    </div>

                    <div class="form_group">
                        <label class="form_label">No. HP</label>
                        <div class="input_container">
                            <input type="tel" placeholder="0812xxxxxxx" class="form_textbox">
                        </div>
                    </div>

                    <div class="form_group vertical">
                        <label class="form_label_full">Tipe Belajar Dominan</label>
                        <div class="radio_group">
                            <div class="radio_item">
                                <input type="radio" id="audio" name="tipe" checked>
                                <label for="audio">Auditori</label>
                            </div>
                            <div class="radio_item">
                                <input type="radio" id="visual" name="tipe">
                                <label for="visual">Visual</label>
                            </div>
                        </div>
                    </div>

                    <div class="form_action">
                        <button type="submit" class="form_button">SIMPAN DATA</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
